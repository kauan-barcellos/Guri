<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 19px; fill: #fbbf24; }
    .quote { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-style: italic; font-size: 16px; fill: #f1f5f9; }
    .pill-green { font-size: 13px; font-weight: 700; fill: #34d399; }
    .pill-blue { font-size: 13px; font-weight: 600; fill: #60a5fa; }
    .ascii { font-size: 14.5px; font-weight: 700; fill: url(#cyanGrad); letter-spacing: 0px; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="256" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Terminal Top Bar -->
  <rect x="2" y="2" width="846" height="36" rx="12" fill="#0f172a" />
  <rect x="2" y="24" width="846" height="14" fill="#0f172a" />
  <line x1="2" y1="38" x2="848" y2="38" stroke="#334155" stroke-width="1" />

  <!-- Terminal Controls -->
  <circle cx="24" cy="20" r="6" fill="#ef4444" />
  <circle cx="44" cy="20" r="6" fill="#f59e0b" />
  <circle cx="64" cy="20" r="6" fill="#10b981" />
  <text x="425" y="24" text-anchor="middle" fill="#64748b" font-size="12" class="mono">guri@terminal: ~</text>

  <!-- ASCII Art Left Side -->
  <g transform="translate(30, 68)">
    <text x="0" y="20" class="mono ascii">   ______  __  ______  ____</text>
    <text x="0" y="42" class="mono ascii">  / ____/ / / / / __ \/  _/</text>
    <text x="0" y="64" class="mono ascii"> / / __  / / / / /_/ // /  </text>
    <text x="0" y="86" class="mono ascii">/ /_/ / / /_/ / _, _// /   </text>
    <text x="0" y="108" class="mono ascii">\____/  \____/_/ |_/___/   </text>
  </g>

  <!-- Divider Line -->
  <line x1="335" y1="58" x2="335" y2="235" stroke="#334155" stroke-width="1" stroke-dasharray="4" />

  <!-- Right Side: Identity & Status -->
  <g transform="translate(365, 80)">
    <text x="0" y="18" class="subtitle">GURI &bull; A mente que pensa</text>
    <text x="0" y="48" class="quote">&ldquo;Vem devagarinho. Qual a boa de hoje?&rdquo;</text>
    
    <line x1="0" y1="68" x2="445" y2="68" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Status Badges -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="22" height="22" rx="6" fill="#064e3b" />
      <text x="11" y="16" text-anchor="middle" fill="#34d399" font-size="13">&check;</text>
      <text x="32" y="16" class="mono pill-green">Status: &Eacute; s&oacute; querer!</text>
    </g>

    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="22" height="22" rx="6" fill="#1e3a5f" />
      <text x="11" y="15" text-anchor="middle" fill="#60a5fa" font-size="12">&#9881;</text>
      <text x="32" y="16" class="mono pill-blue">C&eacute;rebro: Sincronizado via GitHub</text>
    </g>
  </g>
</svg>